name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip git libltdl-dev libffi-dev libssl-dev python3-pip
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer flet requests

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        yes | buildozer -v android debug

    - name: Find and Move APK
      run: |
        mkdir -p final_apk
        find . -name "*.apk" -exec cp {} final_apk/ \;
        ls -la final_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yolyoldas-apk
        path: final_apk/*.apk
